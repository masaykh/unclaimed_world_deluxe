# Builds the game and cross-publishes it for every platform we ship.
#
# ONE Linux runner produces all four RIDs. DesktopGL's SDL2 and OpenAL natives come from the
# MonoGame.Framework.DesktopGL package for every RID, so there is nothing platform-specific to
# do at build time. A macOS runner would be needed only for a SIGNED .app bundle, which needs a
# paid Apple Developer account - so macOS ships unsigned, with Gatekeeper instructions.
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Compiles with mods in, which is the shipping configuration. The other configurations
      # are exercised below rather than shipped.
      - name: Build
        run: dotnet build base_game/UnclaimedWorld/UnclaimedWorld.csproj -c Release -p:UwPlatform=GL -warnaserror

      # The mod/base_game split is a build-time arrangement, so it is a build-time promise and
      # gets checked like one. A build with the harmony feature off must reference no HarmonyLib
      # and ship no 0Harmony.dll - that is the guarantee offered to anyone who does not want a
      # loader for other people's code in their process, and it is worth failing CI over.
      # Two booleans, not a list: ';' and ',' both delimit properties to the dotnet CLI, so a
      # list form fails with MSB1006 however it is quoted. The csproj explains this at length.
      - name: Build without mod loading
        run: dotnet build base_game/UnclaimedWorld/UnclaimedWorld.csproj -c Release -p:UwPlatform=GL -p:UwHarmony=false -p:UwUnhiddenMod=true

      - name: Build with no mods at all
        run: dotnet build base_game/UnclaimedWorld/UnclaimedWorld.csproj -c Release -p:UwPlatform=GL -p:UwHarmony=false -p:UwUnhiddenMod=false

      # The tools that build on a Linux runner. Not all of them do, and that is by design:
      #
      #   DataExport, XmlProxyGen   net8.0-windows + WinForms, unconditionally. They are Windows
      #                             desktop tools, and EnableWindowsTargeting=true would make
      #                             them compile without making them runnable.
      #   ContentProbe              net8.0-windows for DX, plain net8.0 for GL - so it builds
      #                             here, under UwPlatform=GL.
      - name: Tools
        run: |
          for p in tools/MgfxTranscode tools/ContentProbe; do
            dotnet build "$p"/*.csproj -c Release -p:UwPlatform=GL
          done

      # EVERY SHELL SCRIPT MUST PARSE.
      #
      # Two commits landed on main adding a guard to the effects build and the GL packaging step,
      # each with a stray `fi`. Neither script parsed, so both died before their first line of
      # work - and nothing noticed, because the only gate that runs them needs a copy of the game
      # and therefore cannot run here. A script that cannot be parsed is the cheapest possible
      # thing to catch and the most annoying to debug: the error names a line nowhere near the
      # mistake, and the failure looks nothing like the problem.
      #
      # bash -n parses without executing, so this is safe on scripts that would otherwise want a
      # game, a network or an hour.
      - name: Shell scripts parse
        run: |
          rc=0
          for f in $(find tools -name '*.sh' | sort); do
            if bash -n "$f"; then echo "  ok    $f"; else echo "  FAIL  $f"; rc=1; fi
          done
          exit $rc

      # A document that is confidently wrong is worse than one that is missing - the reader has
      # no reason to doubt it. Four claims outlived what they described before this existed.
      - name: Documents are current
        run: sh tools/build/82-verify-docs-current.sh

      # A debug scenario whose hard-coded tiles do not fit its map dies in MapManager.GetTile with
      # an IndexOutOfRangeException and names nothing. Five were in that state and nobody could
      # have known, because the only way to find out was to pick one from a menu that had never
      # been reachable. This needs no game, no content and no graphics device.
      - name: Debug scenarios fit their maps
        run: sh tools/build/83-verify-debug-scenarios.sh

  # CORE DOES NOT DEPEND ON MODS, checked by deleting them.
  #
  # The repository is organised around one rule: base_game is the original game plus the port and
  # its bugfixes, and anything that changes how the game PLAYS and is not a bugfix is a mod. That
  # was an intention for a while and not a fact - the game called all six gameplay mods by name
  # from fifteen places, and base_game would not compile without mods/ at all.
  #
  # It compiles now, because each mod has an Absent stub next to the framework in
  # base_game/UnclaimedWorld/UWGame/Mods/ and the csproj picks the stubs when mods/ is not there.
  # This job is what stops that quietly rotting: a new call into a mod from a core file, or a new
  # mod without a stub, fails HERE rather than the next time somebody wants a clean base game.
  #
  # Its own job, not a step in the one above, so a deleted mods/ cannot leak into anything else.
  core-without-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # No flags. The csproj defaults off the DIRECTORY, so "delete mods/ and build" is the whole
      # test and there is nothing for anyone to remember to keep in sync.
      - name: Delete mods/ and build
        run: |
          rm -rf mods
          dotnet build base_game/UnclaimedWorld/UnclaimedWorld.csproj \
            -c Release -p:UwPlatform=GL -warnaserror

      # Compiling is not the claim. The claim is that the mods' content is NOT IN THE ASSEMBLY -
      # "I did not install that" meaning the code is absent rather than switched off.
      #
      # SEARCHED AS UTF-16, which is the whole correctness of this step. A C# string literal lands
      # in the assembly's #US heap as UTF-16, so `grep -a "_disassemble"` finds nothing WHETHER OR
      # NOT the mod is compiled in - and this check duly passed for weeks while proving exactly
      # nothing. The control string hid it: "Salvage" happens to appear as ASCII in the metadata
      # too, so the one line meant to catch a vacuous check was the one line that was not vacuous.
      #
      # Verified to discriminate: with mods the three markers are present and without them they
      # are absent, while the control is present in both.
      - name: The mods are not in the assembly
        run: |
          python3 - <<'PY'
          import sys
          dll = "artifacts/bin/UnclaimedWorld/release_gl/UnclaimedWorld.dll"
          blob = open(dll, "rb").read()

          def present(s):
              return s.encode("utf-16-le") in blob

          bad = 0
          # Strings that exist ONLY inside a gameplay mod.
          for s in ["_disassemble",
                    "The interface is laid out for at least",
                    "WRITE A STATE DUMP"]:
              if present(s):
                  print("STILL PRESENT: " + s); bad = 1
              else:
                  print("absent: " + s)

          # A string of the studio's own, to prove the search works at all. Without this a typo in
          # the encoding turns the whole step into a pass.
          if not present("Salvaging"):
              print("the studio's own strings are gone too - this check is not checking"); bad = 1
          else:
              print("control present: Salvaging")

          sys.exit(bad)
          PY

  cross-publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish base_game/UnclaimedWorld/UnclaimedWorld.csproj \
            -c Release -p:UwPlatform=GL -r ${{ matrix.rid }} --self-contained false \
            -o artifacts/publish/${{ matrix.rid }}

      # SharpDX is the WindowsDX backend's dependency. A DesktopGL publish that carries one has
      # picked up the wrong backend, which would fail only at runtime and only on Linux/macOS -
      # so it is caught here instead.
      - name: No SharpDX in a DesktopGL build
        run: |
          if ls artifacts/publish/${{ matrix.rid }}/SharpDX* >/dev/null 2>&1; then
            echo "SharpDX assemblies in a DesktopGL publish:"
            ls artifacts/publish/${{ matrix.rid }}/SharpDX*
            exit 1
          fi
          echo "ok - no SharpDX"

      - uses: actions/upload-artifact@v4
        with:
          name: UnclaimedWorld-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/
          if-no-files-found: error
