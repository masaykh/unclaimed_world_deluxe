# Cuts a release: one 7z archive per platform, attached to a GitHub Release.
#
# Tag it and go:
#
#     git tag v1.0 && git push origin v1.0
#
# or run it by hand from the Actions tab, which builds the archives and uploads them as workflow
# artifacts without publishing a Release.
#
# WHAT IS AND IS NOT IN AN ARCHIVE. The game's compiled content - art, audio, models, Content/ -
# is NOT part of what Refactored Games released and is not in this repository, so it cannot be in
# a release either. An archive therefore carries the game's CODE plus everything this project
# adds, and the player supplies Content/ and data/ from their own copy. install.md in the archive
# says how. That is the same arrangement the port has always had; it is what the Community
# License permits and no more.
#
# One Linux runner builds every platform. DesktopGL's SDL2 and OpenAL natives come from the
# MonoGame package for every RID, so there is nothing platform-specific to do at build time, and
# a macOS runner would only be needed for a SIGNED .app - which needs a paid Apple Developer
# account. macOS ships unsigned, with Gatekeeper instructions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. 1.0)'
        required: false
        default: '0.0-dev'

permissions:
  contents: write        # needed to create the Release; nothing else is written

env:
  DOTNET_NOLOGO: 'true'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            label: Windows (x64)
          - rid: linux-x64
            label: Linux (x64)
          - rid: osx-x64
            label: macOS (Intel)
          - rid: osx-arm64
            label: macOS (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"          # v1.0 -> 1.0
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v for ${{ matrix.rid }}"

      - name: Publish
        run: |
          dotnet publish base_game/UnclaimedWorld/UnclaimedWorld.csproj \
            -c Release -p:UwPlatform=GL -r ${{ matrix.rid }} --self-contained false \
            -o stage/UnclaimedWorldDeluxe
          rm -f stage/UnclaimedWorldDeluxe/*.pdb stage/UnclaimedWorldDeluxe/*.dll.config

      # A DesktopGL build that carries SharpDX has picked up the WindowsDX backend, which would
      # fail at runtime and only on Linux/macOS. Catch it before it reaches anyone.
      - name: No SharpDX
        run: |
          if ls stage/UnclaimedWorldDeluxe/SharpDX* >/dev/null 2>&1; then
            echo "SharpDX in a DesktopGL build:"; ls stage/UnclaimedWorldDeluxe/SharpDX*; exit 1
          fi

      # The menu background. Committed rather than generated because making it needs a video
      # decoder - see tools/build/60-package-gl.sh. Without it the menu is a still image, which
      # is a supported state, so this warns rather than fails.
      - name: Menu animation
        run: |
          if [ -f assets/MainMenuIntro.uwanim ]; then
            cp assets/MainMenuIntro.uwanim stage/UnclaimedWorldDeluxe/
          else
            echo "::warning::assets/MainMenuIntro.uwanim missing - the menu will be a still image"
          fi

      - name: Licenses and instructions
        run: |
          cp LICENSE-UnclaimedWorld-Community.md LICENSE-port-MIT.txt license.md \
             how_to_use_mods.md stage/UnclaimedWorldDeluxe/
          cat > stage/UnclaimedWorldDeluxe/install.md <<'EOF'
          # Unclaimed World Deluxe — install

          **This is an unofficial community project. It is not endorsed by, affiliated with, or
          supported by Refactored Games.** Please do not report problems with this build to them.

          **You need to own the game.** This archive has no game content in it — no art, audio,
          models or `Content/`. Those are not part of what the studio released.

          ## Install

          1. Find your copy of *Unclaimed World*. In Steam: right-click the game →
             *Manage* → *Browse local files*.
          2. Copy `Content/` and `data/` from there into this folder, next to the executable.
          3. Run it.

          Your Steam install is not modified. Nothing here writes to it.

          ## Running

          | | |
          |---|---|
          | Windows | `UnclaimedWorld.exe` |
          | Linux | `./UnclaimedWorld` — you may need `chmod +x UnclaimedWorld` first |
          | macOS | `./UnclaimedWorld` — see Gatekeeper, below |

          .NET 8 must be installed: <https://dotnet.microsoft.com/download/dotnet/8.0>
          (the *Runtime* is enough; the SDK also works).

          ### macOS: Gatekeeper

          This build is not code-signed — signing needs a paid Apple Developer account. macOS
          will refuse to run it until you say otherwise:

          ```sh
          xattr -dr com.apple.quarantine .
          chmod +x UnclaimedWorld
          ./UnclaimedWorld
          ```

          ## Mods

          Seven gameplay mods ship with this build, on by default and individually switchable —
          options menu → **MODS**, or `user/ModSettings.xml`. `-nomods` turns all of them off.
          See `how_to_use_mods.md`.

          ## Licensing

          The game is under the Unclaimed World Community License; this port's own code is MIT.
          Both are in this folder, and `license.md` explains which covers what. Non-commercial.
          EOF

      - name: Archive (7z)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          name="UnclaimedWorldDeluxe-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.7z"
          # -mx=9 is worth the CPU here: these are published once and downloaded many times.
          ( cd stage && 7z a -t7z -mx=9 "../$name" UnclaimedWorldDeluxe/ >/dev/null )
          ls -la "$name"
          echo "archive=$name" >> "$GITHUB_ENV"

      - name: Verify the archive
        run: |
          7z t "$archive" >/dev/null && echo "integrity ok"
          # An archive missing the executable is worse than a failed build, because it looks
          # like a release. Check the things a player would notice missing.
          for want in UnclaimedWorldDeluxe/UnclaimedWorld.dll \
                      UnclaimedWorldDeluxe/install.md \
                      UnclaimedWorldDeluxe/LICENSE-UnclaimedWorld-Community.md; do
            7z l "$archive" | grep -q "${want##*/}" || { echo "MISSING from archive: $want"; exit 1; }
          done
          echo "contents ok"

      - uses: actions/upload-artifact@v4
        with:
          name: UnclaimedWorldDeluxe-${{ matrix.rid }}
          path: ${{ env.archive }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.7z
          generate_release_notes: true
          body: |
            **Unclaimed World Deluxe ${{ github.ref_name }}**

            An unofficial community port. **Not endorsed by, affiliated with, or supported by
            Refactored Games** — please don't take problems with this build to them.

            **You need to own the game.** These archives contain no game content: copy `Content/`
            and `data/` from your own install, as `install.md` in the archive describes. Your
            Steam copy is never modified.

            | download | for |
            |---|---|
            | `...-win-x64.7z` | Windows |
            | `...-linux-x64.7z` | Linux |
            | `...-osx-x64.7z` | macOS, Intel |
            | `...-osx-arm64.7z` | macOS, Apple Silicon |

            Needs the [.NET 8 runtime](https://dotnet.microsoft.com/download/dotnet/8.0). macOS
            builds are unsigned — `install.md` has the Gatekeeper command.
