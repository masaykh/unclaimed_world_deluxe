# Cuts a release: one 7z archive per platform, attached to a GitHub Release.
#
# Tag it and go:
#
#     git tag v1.0 && git push origin v1.0
#
# or run it by hand from the Actions tab, which builds the archives and uploads them as workflow
# artifacts without publishing a Release.
#
# WHAT IS AND IS NOT IN AN ARCHIVE. Refactored Games released their assets under the Community
# License, so an archive carries a good deal of them: all 21 maps, the string table, the menu
# animation. data/ ships COMPLETE. What it cannot carry is the compiled Content/ - the textures,
# audio and models the content pipeline produces - so the player copies that ONE folder from
# their own install, and install.md in the archive says so.
#
# One Linux runner builds every platform. DesktopGL's SDL2 and OpenAL natives come from the
# MonoGame package for every RID, so there is nothing platform-specific to do at build time, and
# a macOS runner would only be needed for a SIGNED .app - which needs a paid Apple Developer
# account. macOS ships unsigned, with Gatekeeper instructions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. 1.0)'
        required: false
        default: '0.0-dev'

permissions:
  contents: write        # needed to create the Release; nothing else is written

env:
  DOTNET_NOLOGO: 'true'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            label: Windows (x64)
          - rid: linux-x64
            label: Linux (x64)
          - rid: osx-x64
            label: macOS (Intel)
          - rid: osx-arm64
            label: macOS (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"          # v1.0 -> 1.0
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v for ${{ matrix.rid }}"

      # The build is tools/build/70-make-release.sh, NOT a copy of it inlined here. Two copies of
      # a packaging recipe drift, and the drift only shows up in something a player downloads.
      # It does the publish, the SharpDX guard, data/, the menu animation, the licences,
      # install.md, the 7z and the archive verification - so `sh tools/build/70-make-release.sh`
      # on a laptop produces the same bytes this job does.
      - name: Build the release archive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          sh tools/build/70-make-release.sh "${{ steps.ver.outputs.version }}" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: UnclaimedWorldDeluxe-${{ matrix.rid }}
          path: artifacts/release/*.7z
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.7z
          generate_release_notes: true
          body: |
            **Unclaimed World Deluxe ${{ github.ref_name }}**

            An unofficial community port. **Not endorsed by, affiliated with, or supported by
            Refactored Games** — please don't take problems with this build to them.

            **You need to own the game** — for its `Content` folder, and only that. The maps, the
            string table and the menu animation are already in the archive, because Refactored
            Games released them. `install.md` inside has the details. Your Steam copy is never
            modified.

            | download | for |
            |---|---|
            | `...-win-x64.7z` | Windows |
            | `...-linux-x64.7z` | Linux |
            | `...-osx-x64.7z` | macOS, Intel |
            | `...-osx-arm64.7z` | macOS, Apple Silicon |

            Needs the [.NET 8 runtime](https://dotnet.microsoft.com/download/dotnet/8.0). macOS
            builds are unsigned — `install.md` has the Gatekeeper command.
